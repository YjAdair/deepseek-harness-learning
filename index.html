<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH 神经终端</title>
  <meta name="description" content="淋雨家 DSH（DeepSeek Harness）AI 工作台设计理念学习站：从理念到实战，养成赛博「自己」。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=8" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="fx-scan" aria-hidden="true"></div>
  <div class="fx-vignette" aria-hidden="true"></div>

  <!-- 顶栏：三部分 + 本部分章节 + 已读进度 -->
  <header class="topbar">
    <div class="tb-row">
      <a class="brand" href="#intro" aria-label="回到序章">
        <span class="brand-mark">DSH</span><span class="brand-sub">//神经终端</span>
      </a>
      <nav class="parts" id="parts" aria-label="三部分"></nav>
      <div class="prog-top" aria-live="polite"><span id="prog-txt">已读 0 / 21</span><i><b id="prog-bar"></b></i></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="本部分章节"></nav>
  </header>

  <!-- 本章目录（宽屏） -->
  <aside class="toc" id="toc" aria-label="本章目录"></aside>

  <main id="main">
    <footer class="site-foot" id="foot"></footer>
  </main>

  <!-- 底部状态栏 -->
  <div class="statusbar" aria-live="polite">
    <span>session-0000…</span>
    <span id="sb-scene">场景：00 序章</span>
    <span class="sb-mem"><span>交接</span><i><b id="sb-bar"></b></i><span id="sb-kb">0.0 / 4 KB</span></span>
  </div>

  <noscript><p class="noscript">这个学习站需要启用 JavaScript。</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
